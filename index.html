<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120d1c"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Ajani">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<title>Ajani – Deck Builder & Playtester</title><link rel="stylesheet" href="style.css?v=3"></head>
<body>
<canvas id="bg"></canvas>
<header>
 <div class="brand"><span class="ava sm" id="hAva"></span><b id="hName">Ajani</b></div>
 <div class="game" id="gameSw"><button data-g="mtg">Commander</button><button data-g="ygo">Yu-Gi-Oh!</button><i></i></div>
</header>
<main id="views">
 <section class="view" id="v-build">
  <div class="bar"><select id="deckSel"></select>
   <button class="ib" id="newDeck" title="New deck"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
   <button class="ib" id="renDeck" title="Rename"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button>
   <button class="ib" id="delDeck" title="Delete"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"/></svg></button>
   <button class="ib" id="impDeck" title="Import"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
   <button class="ib" id="expDeck" title="Export"><svg viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></svg></button>
  </div>
  <div class="split">
   <div class="pane">
    <form id="sForm" class="search"><input id="sQ" placeholder="Search cards…" autocomplete="off"><button class="ib"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg></button></form>
    <div class="hint" id="sHint"></div>
    <div class="grid" id="results"></div>
   </div>
   <div class="pane drop" id="deckPane">
    <div id="cmdr"></div>
    <div class="valid" id="valid"></div>
    <div class="charts" id="charts"></div>
    <div id="deckList"></div>
   </div>
  </div>
 </section>
 <section class="view" id="v-ajani">
  <div class="chat" id="chat"></div>
  <div class="status"><div class="pbar"><i id="pb"></i></div><span id="st">AI model not loaded – rule-based suggestions active.</span><button class="sm" id="loadAI">Load AI</button></div>
  <form id="cForm" class="search"><input id="cQ" placeholder="Ask Ajani for cards, synergy, combos…"><button class="ib send"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2-7z"/></svg></button></form>
 </section>
 <section class="view" id="v-play">
  <div class="tag">Playtest vs AI – core rules automated; unusual card text resolved manually (ⓘ)</div>
  <div id="table"></div>
 </section>
 <section class="view" id="v-stats">
  <div class="tag">Goldfish simulation (solo, simplified)</div>
  <div class="bar"><label>Games <input type="number" id="nSim" value="1000" min="10" max="20000"></label><button id="runSim">Run</button></div>
  <div id="simOut"></div>
 </section>
 <section class="view" id="v-set"><div id="settings"></div></section>
</main>
<button id="fab" aria-label="Menu"><svg viewBox="0 0 40 40"><rect class="f1" x="9" y="9" width="14" height="20" rx="2"/><rect class="f2" x="13" y="8" width="14" height="20" rx="2"/><rect class="f3" x="17" y="9" width="14" height="20" rx="2"/></svg><span id="fabL">Build</span></button><div id="dealer"></div>
<nav id="tabs" hidden>
 <button data-v="build"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="11" height="15" rx="2"/><path d="M9 21h9a2 2 0 0 0 2-2V7"/></svg><span>Build</span></button>
 <button data-v="ajani"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Ajani</span></button>
 <button data-v="play"><svg viewBox="0 0 24 24"><path d="M14 4l6 6-9 9-4 1 1-4zM5 5l5 5"/></svg><span>Play</span></button>
 <button data-v="stats"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Stats</span></button>
 <button data-v="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg><span>Settings</span></button>
</nav>
<div id="modal" class="modal"><div class="mbox"><div id="mBody"></div><div class="mact"><button id="mCancel" class="ghost">Close</button><button id="mOk">OK</button></div></div></div>
<div id="zoom" class="zoom"></div><div id="toast"></div>
<input type="file" id="file" hidden>
<script src="app.js?v=3"></script><script src="mtg.js?v=3"></script>
</body></html>
